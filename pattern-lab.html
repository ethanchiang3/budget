                return square && Math.abs(params.stagger - 0.5) < 1e-6 ? `R${d} T${fmt(params.spacingX)}` : `R${d} staggered`;
            })();

            const arraySummary = ((params.holeShape === 'round' && designation) || (patternType === 'radial' ? `Radial · ${params.gridRows} rings` : patternType === 'concentric' ? `Rings · ${fmt(params.spacingY)} mm` : patternType === 'stripes' ? `Stripes · ${fmt(params.spacingY)} mm` : patternType === 'splineGrid' ? `Spline · ${params.gridCols}×${params.gridRows}` : PATTERNS.find(pt => pt.value === patternType).label)) + (params.rotation ? ` · ${fmt(params.rotation, 1)}°` : '');
            const holeSummary = fieldOn ? `${FIELDS.find(f => f.value === attractorMode).label} · Ø${fmt(params.minDiameter)}–${fmt(params.baseDiameter)}` : `Ø${fmt(params.baseDiameter)}`;
            const roundHoles = params.holeShape === 'round';
            const orientLabel = ORIENTS.find(o => o.value === params.holeOrient).label;
            const shapeSummary = roundHoles ? 'Round' : `${HOLE_SHAPES.find(h => h.value === params.holeShape).label} ${fmt(params.holeLength, 1)}× · ${params.holeOrient === 'fixed' ? `${fmt(params.holeTilt, 0)}°` : orientLabel}${params.holeAlt !== 'off' ? ` · alt ${ALTS.find(a => a.value === params.holeAlt).label}` : ''}`;
            const orientHint = params.holeOrient === 'fixed' ? 'Every hole is turned by the same angle.'
                : params.holeOrient === 'radial' ? 'Holes point outward from the pattern centre. Tilt adds an offset.'
                : fieldOn ? `Holes line up along the ${FIELDS.find(f => f.value === attractorMode).label.toLowerCase()} field. Tilt adds an offset.`
                : 'Choose a size field under Holes and the holes will line up along it. Until then, Tilt applies.';
            const boundarySummary = boundaryShape === 'uv' ? `Surface · ${boundW}×${boundH}` : boundaryShape === 'circle' ? `Ø${boundW}` : `${SHAPES.find(s => s.value === boundaryShape).label} · ${boundW}×${boundH}`;
            const pct = (v) => Math.abs(v) < 0.0005 ? '0%' : `${v >= 0 ? '+' : '−'}${Math.abs(v * 100).toFixed(1)}%`;
            // 投影時面積比 = cos(坡度)，孔在斜面上沿坡度方向拉長 1/cos 倍
            const slopeStretch = uvPatch?.projected ? Math.round((1 / Math.max(1 + uvPatch.stretch[0], 0.01) - 1) * 100) : 0;
            const areaWarp = uvPatch && !uvPatch.projected ? Math.max(Math.abs(uvPatch.stretch[0]), Math.abs(uvPatch.stretch[1])) : 0;
            const layoutLabel = !uvPatch ? '' : (uvPatch.projected ? 'Top view' : uvPatch.solver === 'slim' ? 'Min stretch' : uvPatch.solver === 'bff' ? 'BFF' : uvPatch.solver === 'lscm' ? 'LSCM' : UNWRAPS.find(u => u.value === uvPatch.method).label);
            // 孔在零件上的間距變化：面積比 r = 平面/3D，零件上的間距 ∝ 1/√r
            const pitch = uvPatch ? [1 / Math.sqrt(Math.max(1 + uvPatch.stretch[1], 1e-6)) - 1, 1 / Math.sqrt(Math.max(1 + uvPatch.stretch[0], 1e-6)) - 1] : [0, 0];
            const pitchWarp = Math.max(Math.abs(pitch[0]), Math.abs(pitch[1]));
            const holeWarp = uvPatch && !trueSize && (areaWarp > 0.1 || uvPatch.oval > 0.15);
            const surfaceFacts = !uvPatch ? [] : [
                ['Flat size', `${fmt(boundW, 1)} × ${fmt(boundH, 1)} mm`],
                ['Layout', layoutLabel],
                ...(trueSize ? [['Holes on the part', 'true size and shape'], ['Pitch on the part', `${pct(pitch[0])} … ${pct(pitch[1])}`, pitchWarp > 0.15]]
                    : uvPatch.projected ? [['Hole stretch', slopeStretch >= 1 ? `up to +${slopeStretch}% on slopes` : 'none, flat from above', slopeStretch > 40]]
                    : [['Area change', `${pct(uvPatch.stretch[0])} … ${pct(uvPatch.stretch[1])}`, areaWarp > 0.1], ['Hole shape', uvPatch.oval < 0.005 ? 'round' : `up to ${fmt(uvPatch.oval * 100, 0)}% oval`, uvPatch.oval > 0.15]]),
                ...(uvPatch.projected && uvPatch.skipped > 0.005 ? [['Left solid', `${fmt(uvPatch.skipped * 100, 0)}%, steeper than ${fmt(uvPatch.maxSlope, 0)}°`], ['Perforated area', `${fmt(uvPatch.area3D / 100, uvPatch.area3D < 1000 ? 2 : 1)} cm²`]] : [])
            ];
            const surfaceNote = !uvPatch ? null
                : uvPatch.why === 'closed' ? 'This selection is a closed surface, so it can’t be flattened in one piece and was projected flat instead. Select fewer faces, lower the split angle, or use Top view.'
                : uvPatch.why === 'size' ? 'Flattening handles up to 60,000 vertices, so this surface was projected flat. Raise Max edge in step 1, or select a smaller surface.'
                : uvPatch.why === 'flat' ? 'This surface is flat, so there is no cylinder to unroll. It was projected flat instead.'
                : uvPatch.tube && !uvPatch.fallback ? 'This surface is a closed tube, so it can’t open flat without a cut and was squeezed into a ring. Cylinder unrolls it exactly.'
                : uvPatch.fallback ? 'This surface couldn’t be flattened cleanly, so it was projected flat instead. Try splitting it into smaller surfaces.'
                : uvPatch.solver === 'lscm' ? 'This surface has more than one edge loop, so it was flattened with LSCM instead of BFF.'
                : uvPatch.projected && slopeStretch > 40 && !trueSize ? 'Holes on the steep parts stretch along the slope. Turn on true-size holes, lower Max slope, or use Min stretch.'
                : holeWarp ? `Holes will look distorted on the part. Turn on true-size holes${uvPatch.solver === 'slim' ? '' : ', or use Min stretch'}.`
                : trueSize && pitchWarp > 0.15 ? `Every hole keeps its true size on the part. Only the spacing varies, by up to ${fmt(pitchWarp * 100, 0)}%, because this surface curves in two directions and can’t be flattened without some stretch.` : null;
            const UNWRAP_HINTS = { slim: 'SLIM (scalable locally injective maps) spreads the stretch of a curved surface as evenly as possible, so hole sizes and spacing stay closest to the real part. Starts from BFF and never folds over.', top: 'Rows are laid out in plan view and each hole drops straight down onto the part.', planar: 'Projects onto the surface’s best-fit plane.', cylinder: 'Unrolls around the fitted cylinder axis; true cylinders keep their size.', conformal: 'Boundary First Flattening keeps every angle, so holes stay round, but on strongly curved surfaces their size changes.' };
            const selArea = labels ? [...selectedIds].reduce((a, id) => a + labels.area[id], 0) : 0;
            const nSurf = labels ? labels.area.length : 0;
            const srcTris = modelSrc?.kind === 'mesh' ? modelSrc.tri.length / 9 : 0;
            // 網格化滑桿的範圍依模型大小
            const tessScale = useMemo(() => modelSrc ? +(sourceDiag(modelSrc) * unitK).toPrecision(2) : 100, [modelSrc, unitK]);
            const skippedText = modelSrc?.skipped && Object.keys(modelSrc.skipped).length ? Object.entries(modelSrc.skipped).map(([k, n]) => `${n} × ${/^\d+$/.test(k) ? `type ${k}` : k.toLowerCase().replace(/_/g, ' ')}`).join(', ') : '';
            const wsColor = useMemo(() => getComputedStyle(document.documentElement).getPropertyValue('--ws').trim() || '#e5e5e1', [themeTick]);

            const dfmText = issueCount === 0
                ? `Clear for ${fmt(params.thickness)} mm ${finish.plastic ? 'wall' : 'sheet'}`
                : [stats.overlaps && `${stats.overlaps} holes overlap`, stats.small && `${stats.small} holes under Ø${fmt(params.thickness)}`, stats.tight && `${stats.tight} webs under ${fmt(params.thickness)} mm`].filter(Boolean).join(' · ');

            return (
                <div className="app">
                    <header className="topbar">
                        <div className="brand">
                            <Logo />
                            <span className="brand-name">pattern <b>LAB</b></span>
                            <span className="brand-ver">v9</span>
                            <div className="pill mode-pill" role="radiogroup" aria-label="Workspace">
                                <button role="radio" aria-checked={!mode3D} className={!mode3D ? 'on' : ''} title="Flat panel" onClick={() => switchMode(false)}>2D</button>
                                <button role="radio" aria-checked={mode3D} className={mode3D ? 'on' : ''} title="Pattern a 3D surface from an STL" onClick={() => switchMode(true)}>3D</button>
                            </div>
                        </div>
                        <button className="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled={!canUndo} onClick={undo}><Icon name="undo-2" /></button>
                        <button className="icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled={!canRedo} onClick={redo}><Icon name="redo-2" /></button>
                        <span className="tb-sep"></span>
                        <Menu id="file-menu" icon="folder-open" title="Design file and reference image" open={menu === 'file'} onToggle={() => setMenu(m => m === 'file' ? null : 'file')} items={[
                            { icon: 'file-up', label: 'Open design…', hint: 'Load a saved .json design', onClick: () => { setMenu(null); designInputRef.current.click(); } },
                            { icon: 'save', label: 'Save design', hint: 'Every setting as .json', onClick: saveDesign },
                            { icon: 'image-plus', label: 'Add reference image…', hint: 'A photo or drawing to trace over', onClick: () => { setMenu(null); fileInputRef.current.click(); } },
                            '-',
                            { icon: 'rotate-ccw', label: 'Reset to defaults', onClick: resetDesign }
                        ]} />
                        <span className="tb-sep"></span>
                        <Menu id="theme-menu" narrow icon={theme === 'system' ? 'sun-moon' : theme === 'dark' ? 'moon' : 'sun'} title={`Appearance: ${THEMES.find(t => t.value === theme).label}`} open={menu === 'theme'} onToggle={() => setMenu(m => m === 'theme' ? null : 'theme')}
                            items={THEMES.map(t => ({ icon: t.icon, label: t.label, hint: t.hint, checked: theme === t.value, onClick: () => { setTheme(t.value); setMenu(null); } }))} />
                        <a ref={guideLinkRef} className="tb-link" href="#guide" title="Instructions (?)" onClick={e => { e.preventDefault(); setMenu(null); setGuideOpen(true); }}><Icon name="book-open" size={16} /><span className="tb-link-label">Guide</span></a>
                        <input ref={fileInputRef} type="file" hidden accept="image/*" onChange={handleImageUpload} />
                        <input ref={designInputRef} type="file" hidden accept=".json,application/json" onChange={openDesign} />
                        <Menu id="export-menu" primary icon="download" label="Export" labelClass="export-label" title="Export" open={menu === 'export'} onToggle={() => setMenu(m => m === 'export' ? null : 'export')} items={[
                            { icon: 'pen-tool', label: 'SVG drawing', hint: uvPatch ? 'Unwrapped flat pattern, 1:1 mm' : '1:1 mm · holes and outline in separate groups', onClick: exportSVG },
                            { icon: 'drafting-compass', label: 'DXF drawing', hint: uvPatch ? (uvPatch.projected ? 'Top-view pattern in the model’s own X/Y' : 'Unwrapped flat pattern for CAD and laser') : '1:1 mm for CAD and laser · Y up, origin at centre', onClick: exportDXF },
                            { icon: 'sheet', label: 'Hole table (CSV)', hint: uvPatch ? 'Flat x, y, size for every hole' : 'x, y, Ø for every hole · same origin as DXF', onClick: exportCSV },
                            ...(uvPatch ? [{ icon: 'box', label: '3D hole table (CSV)', hint: 'Position, normal, axis and cutting direction per hole, in STL coordinates', onClick: export3DCSV },
                                '-',
                                { icon: 'layers', label: 'Unwrapped surface (OBJ)', hint: 'The selected surface with its UVs, in the model’s coordinates', onClick: exportSurfaceOBJ },
                                { icon: 'box', label: 'Rest of the part (OBJ)', hint: 'Everything except the unwrapped surface, same coordinates', onClick: exportRestOBJ },
                                { icon: 'grid-2x2', label: 'UV map (PNG)', hint: '4096 px texture: mesh, outline and holes, matching the OBJ UVs', onClick: exportUVMapPNG },
                                { icon: 'pen-tool', label: 'UV map (SVG)', hint: 'The same UV layout as vectors, 1:1 mm, in layers', onClick: exportUVMapSVG }] : []),
                            { icon: 'mountain', label: 'Displacement map (PNG)', hint: `16-bit height map, white = high, edges shaped in Displacement${uvPatch ? '; matches the OBJ UVs' : `; ${fmt(params.dispRes)} px per mm`}`, onClick: exportHeightMap },
                            '-',
                            { icon: 'image', label: 'PNG preview', hint: mode3D ? 'High-resolution render of the 3D view' : '3× render of the current view', onClick: exportPNG }
                        ]} />
                    </header>
                    {guideOpen && <Guide onClose={closeGuide} />}

                    <div className="main">
                        <aside className="panel">
                            {mode3D && <>
                            <Section icon="box" title="Model" summary={model ? (isNurbs ? `${modelSrc.format || 'NURBS'} · ${modelSrc.faces.length} face${modelSrc.faces.length > 1 ? 's' : ''}` : 'STL mesh') : ''} open={openSections.model} onToggle={toggleSection('model')}>
                                <div className="btn-row">
                                    <button className="btn-ghost strong" onClick={() => stlInputRef.current.click()}><Icon name="upload" size={14} />{model && !SAMPLE_NAMES.has(model.name) ? 'Open another…' : 'Open STEP, IGES or STL…'}</button>
                                </div>
                                <div className="samples">Samples
                                    {Object.entries(SAMPLES).map(([k, smp]) => <button key={k} className={`chip ${model?.name === smp.name ? 'on' : ''}`} title={`Load the ${smp.name.toLowerCase()} sample`} onClick={() => loadSample(k)}>{smp.short}</button>)}
                                </div>
                                <input ref={stlInputRef} type="file" hidden accept=".stl,.step,.stp,.igs,.iges" onChange={handleModelFile} />
                                {model && <p className="meta" title={model.name}><b>{model.name}</b> · {fmt(model.bbox[3] - model.bbox[0], 1)} × {fmt(model.bbox[4] - model.bbox[1], 1)} × {fmt(model.bbox[5] - model.bbox[2], 1)} mm · {isNurbs ? `${modelSrc.format ? `${modelSrc.format}, ` : ''}${modelSrc.faces.length} face${modelSrc.faces.length > 1 ? 's' : ''}${modelSrc.units ? `, ${modelSrc.units.toLowerCase()}` : ''}` : `STL, ${srcTris.toLocaleString()} triangles`}</p>}
                                {skippedText && <p className="note"><Icon name="info" size={13} />Skipped entities this tool can’t read: {skippedText}.</p>}
                                <p className="hint">STEP and IGES keep the exact surfaces (NURBS, planes, cylinders, fillets), so they can be re-tessellated at any density; assemblies keep their part positions. In Rhino use Export Selected → STEP.</p>
                                <div className="row2">
                                    <div className="param"><span className="param-label">Units</span><Segmented label="Units" inline tight options={UNITS} value={unit} onChange={changeUnit} /></div>
                                    <div className="param"><span className="param-label">Up axis</span><Segmented label="Up axis" inline tight options={UP_AXES} value={upAxis} onChange={setUpAxis} /></div>
                                </div>
                            </Section>

                            <Section step={1} title="Tessellate" summary={model ? `${model.T.toLocaleString()} triangles` : ''} open={openSections.tess} onToggle={toggleSection('tess')}>
                                {tess && (isNurbs ? <>
                                    <div className="row2">
                                        <Param id="tess-edge" label="Max edge" value={tess.edge} min={+(tessScale / 400).toPrecision(1)} max={+(tessScale / 8).toPrecision(2)} step={+(tessScale / 2000).toPrecision(1)} decimals={2} unit="mm" typedMax={tessScale} onChange={v => setTess(t => ({ ...t, edge: v }))} />
                                        <Param id="tess-tol" label="Tolerance" value={tess.tol} min={0.001} max={+(tessScale / 100).toPrecision(1)} step={0.001} decimals={3} unit="mm" typedMax={tessScale / 10} onChange={v => setTess(t => ({ ...t, tol: v }))} />
                                    </div>
                                    <p className="hint">Each face is re-meshed from its exact surface: no edge longer than Max edge, and no point farther than Tolerance from the true surface. Shared edges are sampled once, so neighbouring faces stay stitched.</p>
                                </> : <>
                                    <label className="check"><input type="checkbox" checked={tess.refine} onChange={e => setTess(t => ({ ...t, refine: e.target.checked }))} />Refine: split edges longer than Max edge</label>
                                    {tess.refine && <Param id="tess-edge" label="Max edge" value={tess.edge} min={+(tessScale / 400).toPrecision(1)} max={+(tessScale / 8).toPrecision(2)} step={+(tessScale / 2000).toPrecision(1)} decimals={2} unit="mm" typedMax={tessScale} onChange={v => setTess(t => ({ ...t, edge: v }))} />}
                                    <p className="hint">An STL is already a mesh, so it can only be refined: long edges are split, which smooths BFF and Cylinder unwraps, but the facets stay flat. Open STEP or IGES to re-tessellate from the true surface.</p>
                                </>)}
                                {model && <dl className="facts">
                                    <div><dt>Mesh</dt><dd>{model.T.toLocaleString()} triangles{isNurbs ? ` · ${modelSrc.faces.length} face${modelSrc.faces.length > 1 ? 's' : ''}` : ''}</dd></div>
                                    {tessellated && <div><dt>Built in</dt><dd>{tessellated.ms < 1000 ? `${Math.round(tessellated.ms)} ms` : `${fmt(tessellated.ms / 1000, 1)} s`}</dd></div>}
                                    {tessellated?.failed > 0 && <div><dt>Failed faces</dt><dd className="warn">{tessellated.failed}</dd></div>}
                                    {tessellated?.tooFine && <div><dt>Refine</dt><dd className="warn">too fine, over {(TESS_LIMIT / 1e6).toFixed(1)} M triangles</dd></div>}
                                </dl>}
                                <label className="check"><input type="checkbox" checked={showMesh} onChange={e => setShowMesh(e.target.checked)} />Show the mesh in the 3D view</label>
                            </Section>

                            <Section step={2} title="Split" summary={labels ? `${nSurf.toLocaleString()} surface${nSurf === 1 ? '' : 's'}${selectedIds.size ? ` · ${selectedIds.size} selected` : ''}` : ''} open={openSections.split} onToggle={toggleSection('split')}>
                                {isNurbs && <Segmented label="Split by" inline tight options={SPLITS} value={splitMode} onChange={setSplitMode} />}
                                {!(isNurbs && splitMode === 'face') && <Param id="crease" label="Split angle" value={crease} min={5} max={90} step={1} decimals={0} unit="°" onChange={setCrease} />}
                                <p className="hint">{isNurbs && splitMode === 'face' ? 'Each face from the CAD file is its own surface. Use Crease angle to merge tangent faces, such as fillets, into one.' : 'Neighbouring faces that bend more than the split angle become separate surfaces; tangent faces merge into one.'} Grey lines in the 3D view show the result.</p>
                                <div className={`surface-card ${selectedIds.size ? '' : 'empty'}`}>
                                    {selectedIds.size ? <>
                                        <dl className="facts">
                                            <div><dt>Selected</dt><dd>{selectedIds.size} of {nSurf.toLocaleString()} surface{nSurf === 1 ? '' : 's'}</dd></div>
                                            <div><dt>Area</dt><dd>{fmt(selArea / 100, selArea < 1000 ? 2 : 1)} cm²</dd></div>
                                        </dl>
                                        <div className="btn-row"><button className="btn-ghost" title="Clear the selection (Esc)" onClick={() => setSeeds([])}><Icon name="x" size={14} />Clear selection</button></div>
                                    </> : <p className="hint"><Icon name="mouse-pointer-click" size={14} />Click a surface in the 3D view to perforate it. Shift-click adds or removes surfaces.</p>}
                                </div>
                            </Section>

                            <Section step={3} title="Unwrap" summary={uvPatch ? `${layoutLabel} · ${fmt(boundW, 0)}×${fmt(boundH, 0)}` : ''} open={openSections.unwrap} onToggle={toggleSection('unwrap')}>
                                <Segmented label="Unwrap method" inline tight cols={3} options={UNWRAPS} value={unwrapMode} onChange={setUnwrapMode} />
                                <p className="hint">{UNWRAP_HINTS[unwrapMode]}</p>
                                {(unwrapMode === 'top' || uvPatch?.projected) && <Param id="maxslope" label="Max slope" value={maxSlope} min={10} max={85} step={1} decimals={0} unit="°" onChange={setMaxSlope} />}
                                {uvPatch ? <div className="surface-card">
                                    <dl className="facts">
                                        {surfaceFacts.map(([k, v, warn]) => <div key={k}><dt>{k}</dt><dd className={warn ? 'warn' : ''}>{v}</dd></div>)}
                                    </dl>
                                    {surfaceNote && <p className="note"><Icon name="info" size={13} />{surfaceNote}</p>}
                                    <div className="btn-row">
                                        {uvPatch.tube && (unwrapMode === 'conformal' || unwrapMode === 'slim') && <button className="btn-ghost accent" onClick={() => setUnwrapMode('cylinder')}><Icon name="arrow-right" size={14} />Unwrap with Cylinder</button>}
                                        <button className={`btn-ghost ${fitPending ? 'accent' : ''}`} disabled={!fitPending} title="Scale the whole pattern (pitch, hole sizes and size field) to this surface and centre it" onClick={() => applyFit(false)}><Icon name={fitPending ? 'maximize-2' : 'check'} size={14} />{fitPending ? 'Fit pattern' : 'Pattern fitted'}</button>
                                    </div>
                                </div> : slopeBlocked ? <>
                                    <p className="note"><Icon name="info" size={13} />Every face of this selection is steeper than {fmt(maxSlope, 0)}° from above, so Top view has nowhere to put holes. Raise Max slope, or pick another method.</p>
                                    {/* 牆面、圓柱側面：一鍵改用 BFF */}
                                    <div className="btn-row"><button className="btn-ghost accent" onClick={() => setUnwrapMode('slim')}><Icon name="arrow-right" size={14} />Unwrap with Min stretch</button></div>
                                </>
                                    : <p className="hint">Select a surface in step 2 to unwrap it into the flat panel.</p>}
                                <label className="check" title="Each hole is pre-stretched in the flat layout by the local unwrap distortion, so on the curved part it comes out at its designed size and shape. Exports use the pre-stretched outlines."><input type="checkbox" checked={trueSize} onChange={e => setTrueSize(e.target.checked)} />True-size holes on the part</label>
                                <label className="check"><input type="checkbox" checked={autoFit} onChange={e => { setAutoFit(e.target.checked); autoRef.current = null; }} />Auto-fit the pattern to each new surface</label>
                            </Section>
                            </>}

                            <Section icon="grid-3x3" title="Array" summary={arraySummary} open={openSections.array} onToggle={toggleSection('array')}>
                                <Segmented label="Array type" cols={3} options={PATTERNS} value={patternType} onChange={v => setParams(p => ({ ...p, patternType: v, holeShape: p.holeShape === 'round' && (v === 'stripes' || v === 'concentric') ? 'slot' : p.holeShape }))} />
                                {!mode3D && params.fitFrame && <div className="note"><Icon name="info" size={13} /><span>The pattern is still sized for a {fmt(params.fitFrame.w, 1)} × {fmt(params.fitFrame.h, 1)} mm surface. <button className="link" onClick={() => applyFit(false)}>Fit it to this panel</button></span></div>}
                                {patternType === 'stripes' || patternType === 'concentric' ? <>
                                    <div>
                                        <Param id="ring-pitch" label={patternType === 'stripes' ? 'Stripe pitch' : 'Ring pitch'} value={params.spacingY} min={0.3} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingY')} />
                                    </div>
                                    <p className="hint">{patternType === 'stripes' ? 'Each stripe is one continuous slot cut straight through from edge to edge.' : 'Each ring is one continuous curved slot, cut to the boundary where it leaves the part.'} The slot width follows the size field (Max Ø, Min Ø).</p>
                                </> : patternType === 'radial' ? <>
                                    <div className="row2">
                                        <Param id="rings" label="Rings" value={params.gridRows} min={1} max={150} step={1} decimals={0} onChange={set('gridRows')} />
                                        <Param id="mirror" label="Symmetry" value={params.mirrorCount} min={1} max={32} step={1} decimals={0} unit="×" onChange={set('mirrorCount')} />
                                    </div>
                                    <div className="row2">
                                        <Param id="arc-pitch" label="Arc pitch" value={params.spacingX} min={0.3} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingX')} />
                                        <Param id="ring-pitch" label="Ring pitch" value={params.spacingY} min={0.3} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingY')} />
                                    </div>
                                </> : <>
                                    <div className="row2">
                                        <Param id="cols" label="Columns" value={params.gridCols} min={2} max={150} step={1} decimals={0} onChange={set('gridCols')} />
                                        <Param id="rows" label="Rows" value={params.gridRows} min={2} max={150} step={1} decimals={0} onChange={set('gridRows')} />
                                    </div>
                                    {patternType !== 'splineGrid' && <div className="row2">
                                        <Param id="pitch-x" label="X pitch" value={params.spacingX} min={0.3} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingX')} />
                                        <Param id="pitch-y" label="Y pitch" value={params.spacingY} min={0.3} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingY')} />
                                    </div>}
                                    {patternType !== 'grid' && <Param id="stagger" label="Row stagger" value={params.stagger} min={0} max={1} step={0.01} decimals={2} onChange={set('stagger')} />}
                                    {patternType === 'splineGrid' && <p className="hint"><span className="legend" style={{ background: COLORS.splineA }}></span>Drag the amber control points to bend the rows.</p>}
                                </>}
                                {patternType !== 'splineGrid' && patternType !== 'stripes' && patternType !== 'concentric' && <div><button className="btn-ghost" title="Add or remove columns and rows so the array just covers the boundary; the pitch stays" onClick={fillBoundary}><Icon name="maximize" size={14} />{uvPatch ? 'Fill surface' : 'Fill boundary'}</button></div>}
                                <div className="subhead">Pattern transform</div>
                                <ScaleControl onStart={scaleStart} onScale={scaleBy} onEnd={scaleEnd} />
                                <label className="check"><input type="checkbox" checked={params.scaleHoles} onChange={e => set('scaleHoles')(e.target.checked)} />Scale hole sizes too</label>
                                <Param id="rotation" label="Rotation" value={params.rotation} min={-180} max={180} step={0.5} unit="°" onChange={set('rotation')} />
                                <div className="row2">
                                    <Param id="pattern-x" label="Offset X" value={params.patternX} min={-300} max={300} step={0.5} unit="mm" typedMax={5000} onChange={set('patternX')} />
                                    <Param id="pattern-y" label="Offset Y" value={-params.patternY} min={-300} max={300} step={0.5} unit="mm" typedMax={5000} onChange={v => set('patternY')(-v)} />
                                </div>
                                <p className="hint"><span className="legend" style={{ background: COLORS.pattern }}></span>On the canvas: the violet diamond moves the pattern, the round knob rotates it (Shift snaps to 15°), the square knob scales it.</p>
                                {(params.rotation || params.patternX || params.patternY) ? <div><button className="btn-ghost" onClick={() => setParams(p => ({ ...p, rotation: 0, patternX: 0, patternY: 0 }))}><Icon name="rotate-ccw" size={14} />Reset position and rotation</button></div> : null}
                            </Section>

                            <Section icon="circle-dot" title="Holes" summary={holeSummary} open={openSections.holes} onToggle={toggleSection('holes')}>
                                <Segmented label="Size field" options={FIELDS} value={attractorMode} onChange={set('attractorMode')} />
                                {fieldOn ? <div className="row2">
                                    <Param id="max-dia" label="Max Ø" value={params.baseDiameter} min={0.1} max={10} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('baseDiameter')} />
                                    <Param id="min-dia" label="Min Ø" value={params.minDiameter} min={0.05} max={5} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('minDiameter')} />
                                </div> : <Param id="max-dia" label="Hole Ø" value={params.baseDiameter} min={0.1} max={10} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('baseDiameter')} />}
                                {fieldOn && <div className="row2">
                                    <Param id="influence" label="Influence" value={params.influenceRange} min={1} max={200} step={1} unit="mm" typedMax={2000} onChange={set('influenceRange')} />
                                    <Param id="falloff" label="Falloff" value={params.falloff} min={0.1} max={5} step={0.1} decimals={2} onChange={set('falloff')} />
                                </div>}
                                <div className="param">
                                    <div className="param-head">
                                        <label className="param-label" htmlFor="open-area-num">Open area</label>
                                        <NumberField id="open-area-num" label="Open area" value={stats.openArea} min={0.1} max={90} step={0.5} decimals={1} unit="%" onCommit={matchOpenArea} />
                                    </div>
                                    <p className="hint">Type a target and every hole is resized to reach it; positions stay.</p>
                                </div>
                                {attractorMode === 'radial' && <label className="check"><input type="checkbox" checked={params.attractorLock} onChange={e => { const on = e.target.checked; setParams(p => on ? { ...p, attractorLock: true } : { ...p, attractorLock: false, attractorX: p.patternX, attractorY: p.patternY }); }} />Lock the ring to the array centre</label>}
                                {fieldOn && <p className="hint"><span className="legend" style={{ background: COLORS[attractorMode] }}></span>
                                    {attractorMode === 'radial' ? (params.attractorLock ? 'Holes shrink toward the dashed ring, which moves with the array. Drag its dot to change the radius.' : 'Holes shrink toward the dashed ring. Drag the ring or its centre to move it, and its dot to change the radius.') : attractorMode === 'curve' ? 'Holes shrink toward the curve. Drag its four control points.' : attractorMode === 'edge' ? 'Holes shrink toward the edge of the part or surface and reach full size at the Influence distance in from it.' : 'Holes shrink toward the line. Drag either end.'}
                                </p>}
                            </Section>

                            {patternType !== 'stripes' && patternType !== 'concentric' && <Section icon="shapes" title="Hole shape" summary={shapeSummary} open={openSections.shape} onToggle={toggleSection('shape')}>
                                <Segmented label="Hole shape" glyphs options={HOLE_SHAPES} value={params.holeShape} onChange={set('holeShape')} />
                                {!roundHoles && <>
                                    <div className="row2">
                                        <Param id="hole-length" label="Length" value={params.holeLength} min={1} max={8} step={0.1} decimals={2} unit="×" typedMax={40} onChange={set('holeLength')} />
                                        <Param id="hole-tilt" label="Tilt" value={params.holeTilt} min={-90} max={90} step={1} decimals={1} unit="°" onChange={set('holeTilt')} />
                                    </div>
                                    {params.holeShape === 'rect' && <Param id="hole-corner" label="Corner radius" value={Math.round(params.holeCorner * 100)} min={0} max={100} step={1} decimals={0} unit="%" onChange={v => set('holeCorner')(v / 100)} />}
                                    <Segmented label="Orientation" inline options={ORIENTS} value={params.holeOrient} onChange={set('holeOrient')} />
                                    {fieldOn && <Param id="hole-twist" label="Field twist" value={params.holeTwist} min={-180} max={180} step={1} decimals={1} unit="°" onChange={set('holeTwist')} />}
                                    <div className="param">
                                        <span className="param-label">Alternate rows</span>
                                        <Segmented label="Alternate rows" inline options={ALTS} value={params.holeAlt} onChange={set('holeAlt')} />
                                    </div>
                                    <p className="hint">{orientHint}{fieldOn && params.holeTwist ? ' Field twist turns holes further the closer they sit to the field.' : ''} Alternate rows: Mirror gives herringbone, 90° basket weave, 180° flips triangles. Largest hole: {fmt(stats.maxDia)} × {fmt(stats.maxLen)} mm.</p>
                                </>}
                            </Section>}

                            <Section icon="square-dashed" title="Boundary" summary={boundarySummary} open={openSections.boundary} onToggle={toggleSection('boundary')}>
                                {boundaryShape === 'uv' ? <p className="hint">The boundary is the selected surface, unwrapped flat ({boundW} × {boundH} mm). Choose surfaces in the 3D view.</p> : <>
                                <Segmented label="Boundary shape" inline options={SHAPES} value={params.boundaryShape} onChange={set('boundaryShape')} />
                                {boundaryShape === 'circle'
                                    ? <Param id="diameter" label="Diameter" value={boundW} min={5} max={600} step={0.5} unit="mm" typedMax={5000} onChange={v => resizeBoundary('w', v)} />
                                    : <div className="row2">
                                        <Param id="width" label="Width" value={boundW} min={5} max={600} step={0.5} unit="mm" typedMax={5000} onChange={v => resizeBoundary('w', v)} />
                                        <Param id="height" label="Height" value={boundH} min={5} max={600} step={0.5} unit="mm" typedMax={5000} onChange={v => resizeBoundary('h', v)} />
                                    </div>}
                                </>}
                                <Segmented label="Trim mode" inline options={TRIMS} value={trimTarget} onChange={set('trimTarget')} />
                                <Param id="edge-margin" label="Edge margin" value={params.edgeMargin} min={0} max={20} step={0.1} decimals={1} unit="mm" typedMax={200} onChange={set('edgeMargin')} />
                                <p className="hint">{trimTarget === 'curves' ? 'Rows and rings are re-spaced so the end holes sit on the edge' : 'Holes whose centre falls outside are removed'}{params.edgeMargin > 0 ? `, and every hole stays whole and at least ${fmt(params.edgeMargin, 1)} mm inside it.` : trimTarget === 'curves' ? '.' : '; edge holes are cut through. Set an edge margin to keep a solid border.'}</p>
                            </Section>

                            <Section icon="layers" title="Material" summary={`${fmt(params.thickness)} mm · ${finish.label}`} open={openSections.material} onToggle={toggleSection('material')}>
                                <Param id="thickness" label={finish.plastic ? 'Wall thickness' : 'Sheet thickness'} value={params.thickness} min={0.3} max={6} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('thickness')} />
                                <div className="swatches" role="radiogroup" aria-label="Finish">
                                    {Object.entries(FINISHES).map(([key, f]) => (
                                        <button key={key} role="radio" aria-checked={params.finish === key} title={f.name} className={`swatch ${params.finish === key ? 'on' : ''}`}
                                            onClick={() => { set('finish')(key); setView(v => ({ ...v, mode: 'material' })); }}>
                                            <span className="disc" style={{ background: `linear-gradient(135deg, ${f.sheet[0]}, ${f.sheet[1]} 60%, ${f.sheet[0]})` }}></span>{f.label}
                                        </button>
                                    ))}
                                </div>
                                <p className="hint">{finish.name}, {fmt(finish.density)} g/cm³. {finish.plastic
                                    ? 'Moulded ABS walls are typically 1.2–3.5 mm. The check below applies the same rule as for sheet (hole width and web at least the wall thickness); treat it as a starting point and confirm with your moulder.'
                                    : 'Rule of thumb for punched sheet: hole width and the web between holes should be at least the sheet thickness.'} Webs between non-round holes are approximate.</p>
                            </Section>

                            <Section icon="mountain" title="Displacement" summary={params.dispProfile === 'dome' ? `Dome · ${fmt(params.dispDome, 0)}%` : `${DISP_PROFILES.find(o => o.value === params.dispProfile).label} · ${fmt(params.dispWidth)} mm`} open={openSections.disp} onToggle={toggleSection('disp')}>
                                <BumpProfile P={params} radius={Math.max(stats.maxDia, 0.1) / 2} />
                                <Segmented label="Edge profile" inline tight options={DISP_PROFILES} value={params.dispProfile} onChange={set('dispProfile')} />
                                {params.dispProfile === 'dome' ? <div className="row2">
                                    <Param id="disp-dome" label="Fullness" value={params.dispDome} min={0} max={100} step={1} decimals={0} unit="%" onChange={set('dispDome')} />
                                    <Param id="disp-blur" label="Blur" value={params.dispBlur} min={0} max={5} step={0.05} decimals={2} unit="mm" typedMax={50} onChange={set('dispBlur')} />
                                </div> : <>
                                <div className="row2">
                                    <Param id="disp-width" label="Edge width" value={params.dispWidth} min={0} max={5} step={0.05} decimals={2} unit="mm" typedMax={50} onChange={set('dispWidth')} />
                                    <Param id="disp-blur" label="Blur" value={params.dispBlur} min={0} max={5} step={0.05} decimals={2} unit="mm" typedMax={50} onChange={set('dispBlur')} />
                                </div>
                                <div className="param">
                                    <span className="param-label">Edge sits</span>
                                    <Segmented label="Edge position" inline options={DISP_ALIGNS} value={params.dispAlign} onChange={set('dispAlign')} />
                                </div></>}
                                <div className="param">
                                    <span className="param-label">Holes are</span>
                                    <Segmented label="Hole height" inline options={DISP_POLARITY} value={params.dispPolarity} onChange={set('dispPolarity')} />
                                </div>
                                <Param id="disp-res" label="Map resolution" value={params.dispRes} min={2} max={200} step={1} decimals={0} unit="px/mm" typedMax={400} onChange={set('dispRes')} />
                                <p className="hint">{params.dispProfile === 'dome' ? 'White is high. Dome rises over the whole hole from its outline (dashed) to the centre: a spherical cap on round holes, a rounded ridge on slots. Fullness 100% is a full round; lower values give a shallower cap that meets the surface more gently. Recessed makes dimples.' : <>White is high. Round rounds over the top edge, Cove adds a concave fillet at the base, Smooth eases both ends and Chamfer is a straight slope. Edge width is how far the slope runs {params.dispAlign === 'inside' ? 'in from' : params.dispAlign === 'outside' ? 'out from' : 'across'} the hole outline (dashed); Blur softens everything.</>}</p>
                                <div className="btn-row">
                                    <button className={`btn-ghost ${view.mode === 'height' ? 'accent' : ''}`} onClick={() => setView(v => ({ ...v, mode: v.mode === 'height' ? 'drawing' : 'height' }))}><Icon name={view.mode === 'height' ? 'eye-off' : 'eye'} size={14} />{view.mode === 'height' ? 'Hide height map' : 'Preview height map'}</button>
                                    <button className="btn-ghost" onClick={exportHeightMap}><Icon name="download" size={14} />Export PNG</button>
                                </div>
                            </Section>

                            {bgImage && <Section icon="image" title="Reference" summary={`${Math.round(params.bgOpacity * 100)}%`} open={openSections.reference} onToggle={toggleSection('reference')}>
                                <div className="row2">
                                    <Param id="ref-opacity" label="Opacity" value={Math.round(params.bgOpacity * 100)} min={0} max={100} step={1} decimals={0} unit="%" onChange={v => set('bgOpacity')(v / 100)} />
                                    <Param id="ref-width" label="Width" value={params.bgWidth} min={5} max={600} step={1} unit="mm" typedMax={5000} onChange={set('bgWidth')} />
                                </div>
                                <p className="hint"><span className="legend" style={{ background: COLORS.image }}></span>Drag the image to move it; the blue corner handle scales it.</p>
                                <div><button className="btn-ghost" onClick={() => setBgImage(null)}><Icon name="trash-2" size={14} />Remove image</button></div>
                            </Section>}
                        </aside>

                        <section className={`stage ${mode3D ? 'is3d' : ''}`}>
                          <div className="panes">
                            {mode3D && <Viewport3D model={model} labels={labels} selectedIds={selectedIds} splitGeom={splitGeom} showMesh={showMesh} upAxis={upAxis} patch={uvPatch} dots={dots} holeShape={params.holeShape} holeCorner={params.holeCorner} finishKey={params.finish} finish={finish} guides={view.guides} bg={wsColor} onPick={onPick} apiRef={viewApi} heightMap={view.mode === 'height' ? heightPreview : null} />}
                            <div className="table" ref={tableRef}>
                                {canvasDim.w > 0 && <canvas ref={canvasRef} width={Math.round(canvasDim.w * dpr)} height={Math.round(canvasDim.h * dpr)} style={{ width: canvasDim.w, height: canvasDim.h, cursor: dragMode === 'canvasPan' || dragMode === 'pinch' ? 'grabbing' : undefined }}
                                    onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
                                    onPointerLeave={() => { if (coordsRef.current) coordsRef.current.textContent = 'X        —  Y        —'; }} />}

                                <div className="overlay view-pill">
                                    <div className="pill" role="radiogroup" aria-label="View">
                                        <button role="radio" aria-checked={view.mode === 'drawing'} className={view.mode === 'drawing' ? 'on' : ''} title="Drawing view (M)" onClick={() => setView(v => ({ ...v, mode: 'drawing' }))}>Drawing</button>
                                        <button role="radio" aria-checked={view.mode === 'material'} className={view.mode === 'material' ? 'on' : ''} title="Material view (M)" onClick={() => setView(v => ({ ...v, mode: 'material' }))}>Material</button>
                                        <button role="radio" aria-checked={view.mode === 'height'} className={view.mode === 'height' ? 'on' : ''} title="Height map: the displacement map with the edge profile from the Displacement section (M)" onClick={() => setView(v => ({ ...v, mode: 'height' }))}>Height</button>
                                    </div>
                                    <div className="pill">
                                        <button className={`icon ${view.guides ? '' : 'on'}`} aria-pressed={!view.guides} title={view.guides ? 'Hide guides and handles (H)' : 'Show guides and handles (H)'} onClick={() => setView(v => ({ ...v, guides: !v.guides }))}>
                                            <Icon name={view.guides ? 'eye' : 'eye-off'} size={15} />
                                        </button>
                                    </div>
                                </div>

                                {trimTarget === 'curves' && <div className="overlay trim-badge"><Icon name="scissors" size={12} />Trim curves active</div>}

                                <div className={`overlay card ${cardOpen ? '' : 'collapsed'}`}>
                                    <button className="card-head" aria-expanded={cardOpen} onClick={() => setCardOpen(o => !o)}>
                                        <span className="card-title">Analysis</span>
                                        {!cardOpen && <span className="card-sum">{stats.holes.toLocaleString()} holes · {stats.openArea.toFixed(1)}%{issueCount > 0 && <span className="sum-warn" title={dfmText}> · ⚠ {issueCount.toLocaleString()}</span>}</span>}
                                        <Icon name="chevron-down" size={14} className={`chev ${cardOpen ? 'up' : ''}`} />
                                    </button>
                                    {cardOpen && <>
                                        <dl className="stats">
                                            {designation && <div><dt>Pattern</dt><dd>{designation}</dd></div>}
                                            <div><dt>Holes</dt><dd>{stats.holes.toLocaleString()}</dd></div>
                                            <div><dt>Open area</dt><dd>{stats.openArea.toFixed(1)} %</dd></div>
                                            <div><dt>{roundHoles ? 'Hole Ø' : 'Hole width'}</dt><dd>
                                                <span className="hl" title="Highlight the smallest holes" onMouseEnter={() => setHoverHighlight('min')} onMouseLeave={() => setHoverHighlight('none')}>{stats.minDia.toFixed(2)}</span>
                                                {' – '}
                                                <span className="hl" title="Highlight the largest holes" onMouseEnter={() => setHoverHighlight('max')} onMouseLeave={() => setHoverHighlight('none')}>{stats.maxDia.toFixed(2)}</span> mm
                                            </dd></div>
                                            {!roundHoles && <div><dt>Hole length</dt><dd>{stats.minLen.toFixed(2)} – {stats.maxLen.toFixed(2)} mm</dd></div>}
                                            <div><dt>Min web</dt><dd className={stats.minWeb < params.thickness ? 'warn' : ''}>{Number.isFinite(stats.minWeb) ? `${stats.minWeb.toFixed(2)} mm` : '—'}</dd></div>
                                            <div><dt>Cut length</dt><dd>{stats.cutLength >= 1000 ? `${(stats.cutLength / 1000).toFixed(2)} m` : `${stats.cutLength.toFixed(0)} mm`}</dd></div>
                                            <div><dt>Mass</dt><dd title={`${finish.name}, ${fmt(params.thickness)} mm`}>≈ {stats.mass >= 1000 ? `${(stats.mass / 1000).toFixed(2)} kg` : `${stats.mass.toFixed(0)} g`}</dd></div>
                                        </dl>
                                        <div className={`dfm ${issueCount ? 'warn' : 'ok'}`} title={issueCount ? 'Hover to highlight these holes' : undefined}
                                            onMouseEnter={() => issueCount && setHoverHighlight('issues')} onMouseLeave={() => setHoverHighlight('none')}>
                                            <Icon name={issueCount ? 'triangle-alert' : 'circle-check'} size={14} /><span>{dfmText}</span>
                                            {issueCount > 0 && <button className="dfm-fix" title="Raise holes to the sheet thickness and spread the pattern until every web clears it" onClick={fixDFM}>Fix</button>}
                                        </div>
                                    </>}
                                </div>

                                {mode3D && !uvPatch && <div className="overlay pane-msg-2d">{slopeBlocked ? 'This surface is too steep for the top view. Raise Max slope or pick another unwrap.' : 'Select a surface in the 3D view to unwrap it here.'}</div>}
                                {toast && <div key={toast.id} className="toast" role="status">{toast.msg}{toast.action && <button onClick={() => { toast.action.run(); setToast(null); }}>{toast.action.label}</button>}</div>}
                            </div>
                          </div>

                            <footer className="statusbar">
                                <span className="coords" ref={coordsRef}>X        —  Y        —</span>
                                <span className="scalebar" title="Scale"><i style={{ width: scaleLen * view.zoom }}></i>{fmt(scaleLen)} mm</span>
                                <span className="sb-dim">{boundaryShape === 'circle' ? `Ø ${boundW.toFixed(1)}` : `${boundW.toFixed(1)} × ${boundH.toFixed(1)}`} mm</span>
                                <span className="zoom">
                                    <button className="icon-btn" title="Zoom out (−)" aria-label="Zoom out" onClick={() => zoomBy(0.8)}><Icon name="zoom-out" size={14} /></button>
                                    <span>{view.zoom >= 10 ? view.zoom.toFixed(0) : view.zoom.toFixed(1)}×</span>
                                    <button className="icon-btn" title="Zoom in (+)" aria-label="Zoom in" onClick={() => zoomBy(1.25)}><Icon name="zoom-in" size={14} /></button>
                                    <button className="icon-btn" title="Fit boundary to view (F)" aria-label="Fit boundary to view" onClick={fitView}><Icon name="scan" size={14} /></button>
                                </span>
                            </footer>
                        </section>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
