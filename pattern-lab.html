            };

            // 依優先序找出被抓取的把手：邊界 → 吸引子 → 陣列樣條 → 參考圖；隱藏參考線時只能平移
            const hitTest = (m) => {
                if (!view.guides) return null;
                const near = (x, y) => dist(m.x, m.y, x, y) * view.zoom < HANDLE_RADIUS;
                if (boundaryShape === 'rect') {
                    const corners = [
                        { id: 'TL', x: params.bL, y: params.bT }, { id: 'TR', x: params.bR, y: params.bT },
                        { id: 'BL', x: params.bL, y: params.bB }, { id: 'BR', x: params.bR, y: params.bB }
                    ];
                    for (let c of corners) if (near(c.x, c.y)) return { mode: 'boundaryCorner', index: c.id };
                } else if (boundaryShape === 'circle') {
                    if (near(params.bCX, params.bCY)) return { mode: 'boundaryCircleMove' };
                    if (near(params.bCX, params.bCY - params.bRad)) return { mode: 'boundaryCircleSize' };
                } else {
                    for (let i = 0; i < 4; i++) if (near(params.quadPts[i].x, params.quadPts[i].y)) return { mode: 'points', key: 'quadPts', index: i };
                }
                if (attractorMode === 'radial' && near(params.attractorRadius, 0)) return { mode: 'radialRadius' };
                if (patternType === 'splineGrid') {
                    for (let key of ['boundarySplineA', 'boundarySplineB']) {
                        for (let i = 0; i < 4; i++) if (near(params[key][i].x, params[key][i].y)) return { mode: 'points', key, index: i };
                    }
                }
                const attrKey = attractorMode === 'curve' ? 'cvs' : attractorMode === 'line' ? 'linePts' : null;
                if (attrKey) {
                    for (let i = 0; i < params[attrKey].length; i++) if (near(params[attrKey][i].x, params[attrKey][i].y)) return { mode: 'points', key: attrKey, index: i };
                }
                const img = getImageRect();
                if (img && near(img.x + img.w, img.y + img.h)) return { mode: 'imageScale', left: img.x, top: img.y };
                if (boundaryShape === 'circle' && Math.abs(dist(m.x, m.y, params.bCX, params.bCY) - params.bRad) * view.zoom < HANDLE_RADIUS / 2) return { mode: 'boundaryCircleSize' };
                if (img && m.x >= img.x && m.x <= img.x + img.w && m.y >= img.y && m.y <= img.y + img.h) return { mode: 'imageMove', start: m, startX: params.bgOffsetX, startY: params.bgOffsetY };
                return null;
            };

            const pinchState = () => {
                const [a, b] = [...pointersRef.current.values()];
                const rect = canvasRef.current.getBoundingClientRect();
                return { d: dist(a.x, a.y, b.x, b.y), mx: (a.x + b.x) / 2 - rect.left - rect.width / 2, my: (a.y + b.y) / 2 - rect.top - rect.height / 2 };
            };

            const onPointerDown = (e) => {
                if (!canvasRef.current || (e.button !== 0 && e.button !== 1)) return;
                e.preventDefault();
                e.currentTarget.setPointerCapture(e.pointerId);
                pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointersRef.current.size === 2) {
                    // 雙指：縮放＋平移
                    dragRef.current = { mode: 'pinch', start: pinchState(), zoom: view.zoom, panX: view.panX, panY: view.panY };
                    setDragMode('pinch'); return;
                }
                if (pointersRef.current.size > 2) return;
                const hit = e.button === 0 ? hitTest(toWorld(e.clientX, e.clientY)) : null;
                const drag = hit || { mode: 'canvasPan', startX: e.clientX, startY: e.clientY, panX: view.panX, panY: view.panY };
                dragRef.current = drag;
                setDragMode(drag.mode);
            };

            const onPointerMove = (e) => {
                if (pointersRef.current.has(e.pointerId)) pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
                const { x: mx, y: my } = toWorld(e.clientX, e.clientY);
                if (coordsRef.current) coordsRef.current.textContent = `X ${mx.toFixed(2).padStart(8)}  Y ${(-my).toFixed(2).padStart(8)}`;
                const drag = dragRef.current;
                if (!drag) { e.currentTarget.style.cursor = hitTest({ x: mx, y: my }) ? 'move' : 'grab'; return; }
                if (drag.mode === 'pinch') {
                    if (pointersRef.current.size < 2) return;
                    const now = pinchState(); const s = drag.start;
                    const zoom = clampZoom(drag.zoom * now.d / s.d); const k = zoom / drag.zoom;
                    setView(v => ({ ...v, zoom, panX: now.mx - (s.mx - drag.panX) * k, panY: now.my - (s.my - drag.panY) * k }));
                    return;
                }
                if (drag.mode === 'canvasPan') {
                    setView(v => ({ ...v, panX: drag.panX + e.clientX - drag.startX, panY: drag.panY + e.clientY - drag.startY }));
                    return;
                }
                if (drag.mode === 'boundaryCorner') {
                    if (drag.index === 'TL') setParams(p => ({ ...p, bL: mx, bT: my }));
                    else if (drag.index === 'TR') setParams(p => ({ ...p, bR: mx, bT: my }));
                    else if (drag.index === 'BL') setParams(p => ({ ...p, bL: mx, bB: my }));
                    else if (drag.index === 'BR') setParams(p => ({ ...p, bR: mx, bB: my }));
                } else if (drag.mode === 'boundaryCircleMove') {
                    setParams(p => ({ ...p, bCX: mx, bCY: my }));
                } else if (drag.mode === 'boundaryCircleSize') {
                    setParams(p => ({ ...p, bRad: Math.max(5, dist(mx, my, p.bCX, p.bCY)) }));
                } else if (drag.mode === 'radialRadius') {
                    setParams(p => ({ ...p, attractorRadius: Math.max(0, Math.sqrt(mx*mx + my*my)) }));
                } else if (drag.mode === 'points') {
                    setParams(p => { const updated = [...p[drag.key]]; updated[drag.index] = { x: mx, y: my }; return { ...p, [drag.key]: updated }; });
                } else if (drag.mode === 'imageScale') {
                    // 固定左上角，拖曳右下把手縮放（維持比例）
                    const aspect = (bgImage.height / bgImage.width) || 1;
                    const width = Math.max(5, mx - drag.left, (my - drag.top) / aspect);
                    setParams(p => ({ ...p, bgWidth: width, bgOffsetX: drag.left + width / 2, bgOffsetY: drag.top + width * aspect / 2 }));
                } else if (drag.mode === 'imageMove') {
                    setParams(p => ({ ...p, bgOffsetX: drag.startX + mx - drag.start.x, bgOffsetY: drag.startY + my - drag.start.y }));
                }
            };

            const onPointerUp = (e) => {
                pointersRef.current.delete(e.pointerId);
                if (dragRef.current?.mode === 'pinch' && pointersRef.current.size === 1) {
                    // 雙指放開一指後，剩下那一指接著平移
                    const [p] = [...pointersRef.current.values()];
                    dragRef.current = { mode: 'canvasPan', startX: p.x, startY: p.y, panX: view.panX, panY: view.panY };
                    setDragMode('canvasPan'); return;
                }
                if (pointersRef.current.size === 0) { dragRef.current = null; setDragMode(null); }
            };

            const fileBase = () => `Braun_Pattern_Lab_${Date.now()}`;
            const deliver = async (filename, blob, what) => {
                const result = await saveFile(filename, blob);
                if (result === 'saved') notify(`${what} exported`);
                else if (result !== 'declined') notify(`Couldn't save the file: ${result}`);
            };

            const exportPNG = () => {
                setMenu(null);
                if (canvasDim.w === 0) return;
                // 以至少 3 倍解析度重繪（上限約 40MP），而非直接擷取螢幕畫布
                const scale = Math.min(Math.max(3, window.devicePixelRatio || 1), Math.sqrt(40e6 / (canvasDim.w * canvasDim.h)));
                const off = document.createElement('canvas');
                off.width = Math.round(canvasDim.w * scale); off.height = Math.round(canvasDim.h * scale);
                const ctx = off.getContext('2d', { alpha: false });
                ctx.setTransform(scale, 0, 0, scale, 0, 0);
                drawScene(ctx, canvasDim.w, canvasDim.h, dots, analysis.issues);
                deliver(`${fileBase()}.png`, dataURLToBlob(off.toDataURL('image/png')), 'PNG preview');
            };

            // SVG：1:1 mm，外框與圓孔分成兩個群組（CAD 匯入時成為兩個圖層）
            const exportSVG = () => {
                setMenu(null);
                const b = getBounds();
                const n = (v) => +v.toFixed(3);
                const width = n(b.maxX - b.minX); const height = n(b.maxY - b.minY);
                const pts = outlinePts();
                const outline = pts
                    ? `<polygon points="${pts.map(p => `${n(p.x)},${n(p.y)}`).join(' ')}"/>`
                    : `<circle cx="${n(params.bCX)}" cy="${n(params.bCY)}" r="${n(params.bRad)}"/>`;
                let svg = `<svg width="${width}mm" height="${height}mm" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
                svg += `<g transform="translate(${n(-b.minX)}, ${n(-b.minY)})">`;
                svg += `<g id="boundary" fill="none" stroke="#e11d48" stroke-width="0.1">${outline}</g>`;
                svg += `<g id="holes" fill="${params.color}">`;
                const shape = params.holeShape;
                dots.forEach(d => {
                    const cx = n(d.x), cy = n(d.y), w = d.dia, l = d.len, deg = n(d.ang * 180 / Math.PI);
                    const rot = deg ? ` transform="rotate(${deg} ${cx} ${cy})"` : '';
                    if (shape === 'round') svg += `<circle cx="${cx}" cy="${cy}" r="${n(w / 2)}"/>`;
                    else if (shape === 'ellipse') svg += `<ellipse cx="${cx}" cy="${cy}" rx="${n(l / 2)}" ry="${n(w / 2)}"${rot}/>`;
                    else if (shape === 'hex' || shape === 'tri') svg += `<polygon points="${(shape === 'hex' ? hexVerts : triVerts)(w, l).map(([lx, ly]) => `${n(d.x + lx * Math.cos(d.ang) - ly * Math.sin(d.ang))},${n(d.y + lx * Math.sin(d.ang) + ly * Math.cos(d.ang))}`).join(' ')}"/>`;
                    else { const r = shape === 'slot' ? w / 2 : cornerRadius(d, params.holeCorner); svg += `<rect x="${n(d.x - l / 2)}" y="${n(d.y - w / 2)}" width="${n(l)}" height="${n(w)}" rx="${n(r)}"${rot}/>`; }
                });
                svg += `</g></g></svg>`;
                deliver(`${fileBase()}.svg`, new Blob([svg], { type: 'image/svg+xml' }), 'SVG drawing');
            };

            // DXF (R12)：mm、Y 軸朝上、原點在圖案中心；HOLES 與 BOUNDARY 兩個圖層
            const exportDXF = () => {
                setMenu(null);
                const n = (v) => (+v.toFixed(4)).toString();
                const L = ['0', 'SECTION', '2', 'HEADER', '9', '$INSUNITS', '70', '4', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES'];
                const pts = outlinePts();
                if (pts) {
                    L.push('0', 'POLYLINE', '8', 'BOUNDARY', '66', '1', '10', '0', '20', '0', '30', '0', '70', '1');
                    pts.forEach(p => L.push('0', 'VERTEX', '8', 'BOUNDARY', '10', n(p.x), '20', n(-p.y), '30', '0'));
                    L.push('0', 'SEQEND', '8', 'BOUNDARY');
                } else {
                    L.push('0', 'CIRCLE', '8', 'BOUNDARY', '10', n(params.bCX), '20', n(-params.bCY), '30', '0', '40', n(params.bRad));
                }
                // 孔：圓用 CIRCLE；長孔與圓角矩形用帶 bulge 的閉合 POLYLINE（弧線精確）；橢圓以 72 段折線近似
                const shape = params.holeShape;
                const poly = (d, verts) => { // verts: [lx, ly, bulge]，孔的區域座標（Y 朝上、逆時針）
                    const A = -d.ang, ux = Math.cos(A), uy = Math.sin(A), cx = d.x, cy = -d.y;
                    L.push('0', 'POLYLINE', '8', 'HOLES', '66', '1', '10', '0', '20', '0', '30', '0', '70', '1');
                    verts.forEach(([lx, ly, b]) => { L.push('0', 'VERTEX', '8', 'HOLES', '10', n(cx + lx * ux - ly * uy), '20', n(cy + lx * uy + ly * ux), '30', '0'); if (b) L.push('42', n(b)); });
                    L.push('0', 'SEQEND', '8', 'HOLES');
                };
                const q = Math.tan(Math.PI / 8);
                dots.forEach(d => {
                    const w = d.dia, l = d.len, hw = l / 2, hh = w / 2;
                    if (shape === 'round' || (shape === 'slot' && l - w < 1e-6)) return L.push('0', 'CIRCLE', '8', 'HOLES', '10', n(d.x), '20', n(-d.y), '30', '0', '40', n(w / 2));
                    if (shape === 'slot') { const e = hw - hh; return poly(d, [[-e, -hh, 0], [e, -hh, 1], [e, hh, 0], [-e, hh, 1]]); }
                    if (shape === 'hex' || shape === 'tri') return poly(d, (shape === 'hex' ? hexVerts : triVerts)(w, l).map(([lx, ly]) => [lx, -ly, 0]).reverse());
                    if (shape === 'ellipse') return poly(d, Array.from({ length: 72 }, (_, i) => { const t = i / 72 * Math.PI * 2; return [hw * Math.cos(t), hh * Math.sin(t), 0]; }));
                    const cr = cornerRadius(d, params.holeCorner);
                    if (cr < 1e-6) return poly(d, [[-hw, -hh, 0], [hw, -hh, 0], [hw, hh, 0], [-hw, hh, 0]]);
                    poly(d, [[-hw + cr, -hh, 0], [hw - cr, -hh, q], [hw, -hh + cr, 0], [hw, hh - cr, q], [hw - cr, hh, 0], [-hw + cr, hh, q], [-hw, hh - cr, 0], [-hw, -hh + cr, q]]);
                });
                L.push('0', 'ENDSEC', '0', 'EOF');
                deliver(`${fileBase()}.dxf`, new Blob([L.join('\r\n') + '\r\n'], { type: 'application/dxf' }), 'DXF drawing');
            };

            // 孔位表：mm、Y 軸朝上、原點在圖案中心（與 DXF 相同）
            const exportCSV = () => {
                setMenu(null);
                // 角度：逆時針、Y 朝上，與 DXF 相同
                const rows = ['hole,x_mm,y_mm,shape,width_mm,length_mm,angle_deg'];
                dots.forEach((d, i) => {
                    let deg = -d.ang * 180 / Math.PI; deg = ((deg + 180) % 360 + 360) % 360 - 180;
                    rows.push(`${i + 1},${d.x.toFixed(3)},${(-d.y).toFixed(3)},${params.holeShape},${d.dia.toFixed(3)},${d.len.toFixed(3)},${deg.toFixed(2)}`);
                });
                deliver(`${fileBase()}.csv`, new Blob([rows.join('\n') + '\n'], { type: 'text/csv' }), 'Hole table');
            };

            const saveDesign = () => {
                setMenu(null);
                const body = JSON.stringify({ app: 'pattern LAB', version: 9, design: params }, null, 2);
                deliver(`${fileBase()}.json`, new Blob([body], { type: 'application/json' }), 'Design');
            };

            const openDesign = (e) => {
                const file = e.target.files[0]; e.target.value = '';
                if (!file) return;
                file.text().then(text => {
                    const json = JSON.parse(text);
                    if (!json || typeof json !== 'object' || !(json.design || json.patternType)) throw new Error('not a design');
                    setParams(sanitizeDesign(json.design || json));
                    fittedRef.current = false;
                    notify(`Opened ${file.name}`);
                }).catch(() => notify(`${file.name} isn't a pattern LAB design file`));
            };

            const resetDesign = () => {
                setMenu(null);
                setParams(DEFAULT_DESIGN);
                fittedRef.current = false;
                notify('Reset to defaults · Ctrl+Z to undo');
            };

            // 鍵盤快捷鍵（文字輸入中不觸發）
            useEffect(() => {
                const onKey = (e) => {
                    if (e.target.matches?.('input:not([type=range]), textarea')) return;
                    const mod = e.metaKey || e.ctrlKey; const key = e.key.toLowerCase();
                    if (mod && key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
                    else if (mod && key === 'y') { e.preventDefault(); redo(); }
                    else if (mod || e.altKey) return;
                    else if (key === 'f') fitView();
                    else if (key === 'h') setView(v => ({ ...v, guides: !v.guides }));
                    else if (key === 'm') setView(v => ({ ...v, mode: v.mode === 'material' ? 'drawing' : 'material' }));
                    else if (key === '=' || key === '+') zoomBy(1.25);
                    else if (key === '-') zoomBy(0.8);
                    else if (key === 'escape') setMenu(null);
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            });

            useEffect(() => {
                if (!menu) return;
                const close = (e) => { if (!e.target.closest('.menu-wrap')) setMenu(null); };
                window.addEventListener('pointerdown', close);
                return () => window.removeEventListener('pointerdown', close);
            }, [menu]);

            useLayoutEffect(() => {
                const updateSize = () => { if (tableRef.current) setCanvasDim({ w: tableRef.current.clientWidth, h: tableRef.current.clientHeight }); };
                updateSize();
                const obs = new ResizeObserver(updateSize);
                if (tableRef.current) obs.observe(tableRef.current);
                return () => obs.disconnect();
            }, []);

            const dpr = window.devicePixelRatio || 1;

            // 圖案與分析只在設計變更時重算；平移縮放只重繪
            const { dots, analysis } = useMemo(() => { const dots = collectDots(); return { dots, analysis: analyze(dots) }; }, [params]);
            const stats = useMemo(() => {
                const area = getArea();
                const finish = FINISHES[params.finish] || FINISHES.aluminium;
                let minDia = Infinity, maxDia = 0, minLen = Infinity, maxLen = 0;
                dots.forEach(d => { minDia = Math.min(minDia, d.dia); maxDia = Math.max(maxDia, d.dia); minLen = Math.min(minLen, d.len); maxLen = Math.max(maxLen, d.len); });
                return {
                    holes: dots.length,
                    openArea: area > 0 ? analysis.holeArea / area * 100 : 0,
                    minDia: dots.length ? minDia : 0, maxDia, minLen: dots.length ? minLen : 0, maxLen,
                    minWeb: analysis.minWeb, small: analysis.small, tight: analysis.tight, overlaps: analysis.overlaps,
                    cutLength: analysis.cutLength,
                    mass: Math.max(0, area - analysis.holeArea) * params.thickness / 1000 * finish.density
                };
            }, [dots, analysis]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || canvasDim.w === 0) return;
                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawScene(ctx, canvasDim.w, canvasDim.h, dots, analysis.issues);
            }, [dots, analysis, params, view, canvasDim, hoverHighlight, bgImage, dpr, themeTick]);

            const bounds = getBounds();
            const boundW = round1(bounds.maxX - bounds.minX); const boundH = round1(bounds.maxY - bounds.minY);
            const toggleSection = (key) => () => setOpenSections(s => ({ ...s, [key]: !s[key] }));
            const fieldOn = attractorMode !== 'none';
            const finish = FINISHES[params.finish] || FINISHES.aluminium;
            const scaleLen = niceLength(view.zoom);
            const issueCount = stats.small + stats.tight + stats.overlaps;

            // 穿孔板業界標示：R = 圓孔、T = 60° 交錯孔距、U = 直排孔距
            const designation = (() => {
                const shapeLabel = HOLE_SHAPES.find(h => h.value === params.holeShape).label;
                if (params.holeShape !== 'round') return dots.length ? `${shapeLabel} ${fmt(stats.maxDia, 1)}×${fmt(stats.maxLen, 1)}` : null;
                if (patternType !== 'grid' && patternType !== 'hexagonal') return null;
                const d = fieldOn ? `${fmt(stats.minDia, 1)}–${fmt(stats.maxDia, 1)}` : fmt(params.baseDiameter);
                const square = Math.abs(params.spacingX - params.spacingY) < 1e-6;
                if (patternType === 'grid') return square ? `R${d} U${fmt(params.spacingX)}` : `R${d} U${fmt(params.spacingX)}×${fmt(params.spacingY)}`;
                return square && Math.abs(params.stagger - 0.5) < 1e-6 ? `R${d} T${fmt(params.spacingX)}` : `R${d} staggered`;
            })();

            const arraySummary = (params.holeShape === 'round' && designation) || (patternType === 'radial' ? `Radial · ${params.gridRows} rings` : `Spline · ${params.gridCols}×${params.gridRows}`);
            const holeSummary = fieldOn ? `${FIELDS.find(f => f.value === attractorMode).label} · Ø${fmt(params.minDiameter)}–${fmt(params.baseDiameter)}` : `Ø${fmt(params.baseDiameter)}`;
            const roundHoles = params.holeShape === 'round';
            const orientLabel = ORIENTS.find(o => o.value === params.holeOrient).label;
            const shapeSummary = roundHoles ? 'Round' : `${HOLE_SHAPES.find(h => h.value === params.holeShape).label} ${fmt(params.holeLength, 1)}× · ${params.holeOrient === 'fixed' ? `${fmt(params.holeTilt, 0)}°` : orientLabel}${params.holeAlt !== 'off' ? ` · alt ${ALTS.find(a => a.value === params.holeAlt).label}` : ''}`;
            const orientHint = params.holeOrient === 'fixed' ? 'Every hole is turned by the same angle.'
                : params.holeOrient === 'radial' ? 'Holes point outward from the pattern centre. Tilt adds an offset.'
                : fieldOn ? `Holes line up along the ${FIELDS.find(f => f.value === attractorMode).label.toLowerCase()} field. Tilt adds an offset.`
                : 'Choose a size field under Holes and the holes will line up along it. Until then, Tilt applies.';
            const boundarySummary = boundaryShape === 'circle' ? `Ø${boundW}` : `${SHAPES.find(s => s.value === boundaryShape).label} · ${boundW}×${boundH}`;

            const dfmText = issueCount === 0
                ? `Clear for ${fmt(params.thickness)} mm sheet`
                : [stats.overlaps && `${stats.overlaps} holes overlap`, stats.small && `${stats.small} holes under Ø${fmt(params.thickness)}`, stats.tight && `${stats.tight} webs under ${fmt(params.thickness)} mm`].filter(Boolean).join(' · ');

            return (
                <div className="app">
                    <header className="topbar">
                        <div className="brand">
                            <Logo />
                            <span className="brand-name">pattern <b>LAB</b></span>
                            <span className="brand-ver">v9</span>
                        </div>
                        <button className="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled={!canUndo} onClick={undo}><Icon name="undo-2" /></button>
                        <button className="icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled={!canRedo} onClick={redo}><Icon name="redo-2" /></button>
                        <span className="tb-sep"></span>
                        <Menu id="file-menu" icon="folder-open" title="Design file" open={menu === 'file'} onToggle={() => setMenu(m => m === 'file' ? null : 'file')} items={[
                            { icon: 'file-up', label: 'Open design…', hint: 'Load a saved .json design', onClick: () => { setMenu(null); designInputRef.current.click(); } },
                            { icon: 'save', label: 'Save design', hint: 'Every setting as .json', onClick: saveDesign },
                            '-',
                            { icon: 'rotate-ccw', label: 'Reset to defaults', onClick: resetDesign }
                        ]} />
                        <button className="icon-btn" title="Add reference image" aria-label="Add reference image" onClick={() => fileInputRef.current.click()}><Icon name="image-plus" /></button>
                        <input ref={fileInputRef} type="file" hidden accept="image/*" onChange={handleImageUpload} />
                        <input ref={designInputRef} type="file" hidden accept=".json,application/json" onChange={openDesign} />
                        <Menu id="export-menu" primary icon="download" label="Export" labelClass="export-label" title="Export" open={menu === 'export'} onToggle={() => setMenu(m => m === 'export' ? null : 'export')} items={[
                            { icon: 'pen-tool', label: 'SVG drawing', hint: '1:1 mm · holes and outline in separate groups', onClick: exportSVG },
                            { icon: 'drafting-compass', label: 'DXF drawing', hint: '1:1 mm for CAD and laser · Y up, origin at centre', onClick: exportDXF },
                            { icon: 'sheet', label: 'Hole table (CSV)', hint: 'x, y, Ø for every hole · same origin as DXF', onClick: exportCSV },
                            '-',
                            { icon: 'image', label: 'PNG preview', hint: '3× render of the current view', onClick: exportPNG }
                        ]} />
                    </header>

                    <div className="main">
                        <aside className="panel">
                            <Section icon="grid-3x3" title="Array" summary={arraySummary} open={openSections.array} onToggle={toggleSection('array')}>
                                <Segmented label="Array type" options={PATTERNS} value={patternType} onChange={set('patternType')} />
                                {patternType === 'radial' ? <>
                                    <div className="row2">
                                        <Param id="rings" label="Rings" value={params.gridRows} min={1} max={150} step={1} decimals={0} onChange={set('gridRows')} />
                                        <Param id="mirror" label="Symmetry" value={params.mirrorCount} min={1} max={32} step={1} decimals={0} unit="×" onChange={set('mirrorCount')} />
                                    </div>
                                    <div className="row2">
                                        <Param id="arc-pitch" label="Arc pitch" value={params.spacingX} min={1.5} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingX')} />
                                        <Param id="ring-pitch" label="Ring pitch" value={params.spacingY} min={1.5} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingY')} />
                                    </div>
                                    <Param id="rotation" label="Rotation" value={params.rotation} min={0} max={360} step={0.5} unit="°" onChange={set('rotation')} />
                                </> : <>
                                    <div className="row2">
                                        <Param id="cols" label="Columns" value={params.gridCols} min={2} max={150} step={1} decimals={0} onChange={set('gridCols')} />
                                        <Param id="rows" label="Rows" value={params.gridRows} min={2} max={150} step={1} decimals={0} onChange={set('gridRows')} />
                                    </div>
                                    {patternType !== 'splineGrid' && <div className="row2">
                                        <Param id="pitch-x" label="X pitch" value={params.spacingX} min={1.5} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingX')} />
                                        <Param id="pitch-y" label="Y pitch" value={params.spacingY} min={1.5} max={30} step={0.5} unit="mm" typedMax={200} onChange={set('spacingY')} />
                                    </div>}
                                    {patternType !== 'grid' && <Param id="stagger" label="Row stagger" value={params.stagger} min={0} max={1} step={0.01} decimals={2} onChange={set('stagger')} />}
                                    {patternType === 'splineGrid' && <p className="hint"><span className="legend" style={{ background: COLORS.splineA }}></span>Drag the amber control points to bend the rows.</p>}
                                </>}
                            </Section>

                            <Section icon="circle-dot" title="Holes" summary={holeSummary} open={openSections.holes} onToggle={toggleSection('holes')}>
                                <Segmented label="Size field" options={FIELDS} value={attractorMode} onChange={set('attractorMode')} />
                                {fieldOn ? <div className="row2">
                                    <Param id="max-dia" label="Max Ø" value={params.baseDiameter} min={0.5} max={10} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('baseDiameter')} />
                                    <Param id="min-dia" label="Min Ø" value={params.minDiameter} min={0.1} max={5} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('minDiameter')} />
                                </div> : <Param id="max-dia" label="Hole Ø" value={params.baseDiameter} min={0.5} max={10} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('baseDiameter')} />}
                                {fieldOn && <div className="row2">
                                    <Param id="influence" label="Influence" value={params.influenceRange} min={5} max={200} step={1} unit="mm" typedMax={2000} onChange={set('influenceRange')} />
                                    <Param id="falloff" label="Falloff" value={params.falloff} min={0.1} max={5} step={0.1} decimals={2} onChange={set('falloff')} />
                                </div>}
                                {fieldOn && <p className="hint"><span className="legend" style={{ background: COLORS[attractorMode] }}></span>
                                    {attractorMode === 'radial' ? 'Holes shrink toward the dashed ring. Drag its handle to change the radius.' : attractorMode === 'curve' ? 'Holes shrink toward the curve. Drag its four control points.' : 'Holes shrink toward the line. Drag either end.'}
                                </p>}
                            </Section>

                            <Section icon="shapes" title="Hole shape" summary={shapeSummary} open={openSections.shape} onToggle={toggleSection('shape')}>
                                <Segmented label="Hole shape" glyphs options={HOLE_SHAPES} value={params.holeShape} onChange={set('holeShape')} />
                                {!roundHoles && <>
                                    <div className="row2">
                                        <Param id="hole-length" label="Length" value={params.holeLength} min={1} max={8} step={0.1} decimals={2} unit="×" typedMax={40} onChange={set('holeLength')} />
                                        <Param id="hole-tilt" label="Tilt" value={params.holeTilt} min={-90} max={90} step={1} decimals={1} unit="°" onChange={set('holeTilt')} />
                                    </div>
                                    {params.holeShape === 'rect' && <Param id="hole-corner" label="Corner radius" value={Math.round(params.holeCorner * 100)} min={0} max={100} step={1} decimals={0} unit="%" onChange={v => set('holeCorner')(v / 100)} />}
                                    <Segmented label="Orientation" inline options={ORIENTS} value={params.holeOrient} onChange={set('holeOrient')} />
                                    {fieldOn && <Param id="hole-twist" label="Field twist" value={params.holeTwist} min={-180} max={180} step={1} decimals={1} unit="°" onChange={set('holeTwist')} />}
                                    <div className="param">
                                        <span className="param-label">Alternate rows</span>
                                        <Segmented label="Alternate rows" inline options={ALTS} value={params.holeAlt} onChange={set('holeAlt')} />
                                    </div>
                                    <p className="hint">{orientHint}{fieldOn && params.holeTwist ? ' Field twist turns holes further the closer they sit to the field.' : ''} Alternate rows: Mirror gives herringbone, 90° basket weave, 180° flips triangles. Largest hole: {fmt(stats.maxDia)} × {fmt(stats.maxLen)} mm.</p>
                                </>}
                            </Section>

                            <Section icon="square-dashed" title="Boundary" summary={boundarySummary} open={openSections.boundary} onToggle={toggleSection('boundary')}>
                                <Segmented label="Boundary shape" inline options={SHAPES} value={boundaryShape} onChange={set('boundaryShape')} />
                                {boundaryShape === 'circle'
                                    ? <Param id="diameter" label="Diameter" value={boundW} min={5} max={600} step={0.5} unit="mm" typedMax={5000} onChange={v => resizeBoundary('w', v)} />
                                    : <div className="row2">
                                        <Param id="width" label="Width" value={boundW} min={5} max={600} step={0.5} unit="mm" typedMax={5000} onChange={v => resizeBoundary('w', v)} />
                                        <Param id="height" label="Height" value={boundH} min={5} max={600} step={0.5} unit="mm" typedMax={5000} onChange={v => resizeBoundary('h', v)} />
                                    </div>}
                                <Segmented label="Trim mode" inline options={TRIMS} value={trimTarget} onChange={set('trimTarget')} />
                                <p className="hint">{trimTarget === 'curves' ? 'Rows and rings are re-spaced so holes land exactly on the edge.' : 'Holes whose centre falls outside are removed; edge holes stay whole.'}</p>
                            </Section>

                            <Section icon="layers" title="Material" summary={`${fmt(params.thickness)} mm · ${finish.label}`} open={openSections.material} onToggle={toggleSection('material')}>
                                <Param id="thickness" label="Sheet thickness" value={params.thickness} min={0.3} max={6} step={0.1} decimals={2} unit="mm" typedMax={50} onChange={set('thickness')} />
                                <div className="swatches" role="radiogroup" aria-label="Finish">
                                    {Object.entries(FINISHES).map(([key, f]) => (
                                        <button key={key} role="radio" aria-checked={params.finish === key} title={f.name} className={`swatch ${params.finish === key ? 'on' : ''}`}
                                            onClick={() => { set('finish')(key); setView(v => ({ ...v, mode: 'material' })); }}>
                                            <span className="disc" style={{ background: `linear-gradient(135deg, ${f.sheet[0]}, ${f.sheet[1]} 60%, ${f.sheet[0]})` }}></span>{f.label}
                                        </button>
                                    ))}
                                </div>
                                <p className="hint">{finish.name}, {fmt(finish.density)} g/cm³. Rule of thumb for punched sheet: hole width and the web between holes should be at least the sheet thickness. Webs between non-round holes are approximate.</p>
                            </Section>

                            {bgImage && <Section icon="image" title="Reference" summary={`${Math.round(params.bgOpacity * 100)}%`} open={openSections.reference} onToggle={toggleSection('reference')}>
                                <div className="row2">
                                    <Param id="ref-opacity" label="Opacity" value={Math.round(params.bgOpacity * 100)} min={0} max={100} step={1} decimals={0} unit="%" onChange={v => set('bgOpacity')(v / 100)} />
                                    <Param id="ref-width" label="Width" value={params.bgWidth} min={5} max={600} step={1} unit="mm" typedMax={5000} onChange={set('bgWidth')} />
                                </div>
                                <p className="hint"><span className="legend" style={{ background: COLORS.image }}></span>Drag the image to move it; the blue corner handle scales it.</p>
                                <div><button className="btn-ghost" onClick={() => setBgImage(null)}><Icon name="trash-2" size={14} />Remove image</button></div>
                            </Section>}
                        </aside>

                        <section className="stage">
                            <div className="table" ref={tableRef}>
                                {canvasDim.w > 0 && <canvas ref={canvasRef} width={Math.round(canvasDim.w * dpr)} height={Math.round(canvasDim.h * dpr)} style={{ width: canvasDim.w, height: canvasDim.h, cursor: dragMode === 'canvasPan' || dragMode === 'pinch' ? 'grabbing' : undefined }}
                                    onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
                                    onPointerLeave={() => { if (coordsRef.current) coordsRef.current.textContent = 'X        —  Y        —'; }} />}

                                <div className="overlay view-pill">
                                    <div className="pill" role="radiogroup" aria-label="View">
                                        <button role="radio" aria-checked={view.mode === 'drawing'} className={view.mode === 'drawing' ? 'on' : ''} title="Drawing view (M)" onClick={() => setView(v => ({ ...v, mode: 'drawing' }))}>Drawing</button>
                                        <button role="radio" aria-checked={view.mode === 'material'} className={view.mode === 'material' ? 'on' : ''} title="Material view (M)" onClick={() => setView(v => ({ ...v, mode: 'material' }))}>Material</button>
                                    </div>
                                    <div className="pill">
                                        <button className={`icon ${view.guides ? '' : 'on'}`} aria-pressed={!view.guides} title={view.guides ? 'Hide guides and handles (H)' : 'Show guides and handles (H)'} onClick={() => setView(v => ({ ...v, guides: !v.guides }))}>
                                            <Icon name={view.guides ? 'eye' : 'eye-off'} size={15} />
                                        </button>
                                    </div>
                                </div>

                                {trimTarget === 'curves' && <div className="overlay trim-badge"><Icon name="scissors" size={12} />Trim curves active</div>}

                                <div className={`overlay card ${cardOpen ? '' : 'collapsed'}`}>
                                    <button className="card-head" aria-expanded={cardOpen} onClick={() => setCardOpen(o => !o)}>
                                        <span className="card-title">Analysis</span>
                                        {!cardOpen && <span className="card-sum">{stats.holes.toLocaleString()} holes · {stats.openArea.toFixed(1)}%</span>}
                                        <Icon name="chevron-down" size={14} className={`chev ${cardOpen ? 'up' : ''}`} />
                                    </button>
                                    {cardOpen && <>
                                        <dl className="stats">
                                            {designation && <div><dt>Pattern</dt><dd>{designation}</dd></div>}
                                            <div><dt>Holes</dt><dd>{stats.holes.toLocaleString()}</dd></div>
                                            <div><dt>Open area</dt><dd>{stats.openArea.toFixed(1)} %</dd></div>
                                            <div><dt>{roundHoles ? 'Hole Ø' : 'Hole width'}</dt><dd>
                                                <span className="hl" title="Highlight the smallest holes" onMouseEnter={() => setHoverHighlight('min')} onMouseLeave={() => setHoverHighlight('none')}>{stats.minDia.toFixed(2)}</span>
                                                {' – '}
                                                <span className="hl" title="Highlight the largest holes" onMouseEnter={() => setHoverHighlight('max')} onMouseLeave={() => setHoverHighlight('none')}>{stats.maxDia.toFixed(2)}</span> mm
                                            </dd></div>
                                            {!roundHoles && <div><dt>Hole length</dt><dd>{stats.minLen.toFixed(2)} – {stats.maxLen.toFixed(2)} mm</dd></div>}
                                            <div><dt>Min web</dt><dd className={stats.minWeb < params.thickness ? 'warn' : ''}>{Number.isFinite(stats.minWeb) ? `${stats.minWeb.toFixed(2)} mm` : '—'}</dd></div>
                                            <div><dt>Cut length</dt><dd>{stats.cutLength >= 1000 ? `${(stats.cutLength / 1000).toFixed(2)} m` : `${stats.cutLength.toFixed(0)} mm`}</dd></div>
                                            <div><dt>Mass</dt><dd title={`${finish.name}, ${fmt(params.thickness)} mm`}>≈ {stats.mass >= 1000 ? `${(stats.mass / 1000).toFixed(2)} kg` : `${stats.mass.toFixed(0)} g`}</dd></div>
                                        </dl>
                                        <div className={`dfm ${issueCount ? 'warn' : 'ok'}`} title={issueCount ? 'Hover to highlight these holes' : undefined}
                                            onMouseEnter={() => issueCount && setHoverHighlight('issues')} onMouseLeave={() => setHoverHighlight('none')}>
                                            <Icon name={issueCount ? 'triangle-alert' : 'circle-check'} size={14} /><span>{dfmText}</span>
                                        </div>
                                    </>}
                                </div>

                                {toast && <div key={toast.id} className="toast" role="status">{toast.msg}</div>}
                            </div>

                            <footer className="statusbar">
                                <span className="coords" ref={coordsRef}>X        —  Y        —</span>
                                <span className="scalebar" title="Scale"><i style={{ width: scaleLen * view.zoom }}></i>{fmt(scaleLen)} mm</span>
                                <span className="sb-dim">{boundaryShape === 'circle' ? `Ø ${boundW.toFixed(1)}` : `${boundW.toFixed(1)} × ${boundH.toFixed(1)}`} mm</span>
                                <span className="zoom">
                                    <button className="icon-btn" title="Zoom out (−)" aria-label="Zoom out" onClick={() => zoomBy(0.8)}><Icon name="zoom-out" size={14} /></button>
                                    <span>{view.zoom >= 10 ? view.zoom.toFixed(0) : view.zoom.toFixed(1)}×</span>
                                    <button className="icon-btn" title="Zoom in (+)" aria-label="Zoom in" onClick={() => zoomBy(1.25)}><Icon name="zoom-in" size={14} /></button>
                                    <button className="icon-btn" title="Fit boundary to view (F)" aria-label="Fit boundary to view" onClick={fitView}><Icon name="scan" size={14} /></button>
                                </span>
                            </footer>
                        </section>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
